<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>삼춘네 질문 도우미</title>

  <!-- ===== 외부 라이브러리 (CDN) ===== -->
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 마크다운 렌더링 -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- 한글 폰트: Pretendard(본문) + Gaegu(손글씨 포인트) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Jua&display=swap" rel="stylesheet" />

  <style>
    :root{
      --ink:#15366b;         /* 진한 남색 글씨 */
      --blue:#2563eb;        /* 기본 파랑 */
      --sky:#eaf2ff;         /* 옅은 하늘 배경 */
      --paper:#f5f9ff;       /* 종이 느낌 배경 */
      --honey:#f59e0b;       /* 꿀색 포인트 (삼춘의 따뜻함) */
      --mint:#0ea5a4;        /* 탐구 단계 강조 */
    }
    body{ font-family:'Pretendard',system-ui,sans-serif; color:var(--ink); background:var(--paper); }
    .font-hand{ font-family:'Gaegu',cursive; }

    /* 로딩 스피너 */
    .spinner{
      width:18px; height:18px; border:3px solid rgba(255,255,255,.45);
      border-top-color:#fff; border-radius:50%; animation:spin .8s linear infinite;
    }
    @keyframes spin{ to{ transform:rotate(360deg); } }

    /* 렌즈 카드 선택 상태 */
    .lens-card{ transition:all .15s ease; }
    .lens-card.selected{
      border-color:var(--honey); background:#fff7e6;
      box-shadow:0 4px 14px rgba(245,158,11,.25); transform:translateY(-2px);
    }

    /* 질문 사다리 계단 등장 애니메이션 */
    .rung{ opacity:0; transform:translateY(12px); animation:rise .45s ease forwards; }
    .rung:nth-child(1){ animation-delay:.05s; }
    .rung:nth-child(2){ animation-delay:.18s; }
    .rung:nth-child(3){ animation-delay:.31s; }
    .rung:nth-child(4){ animation-delay:.44s; }
    @keyframes rise{ to{ opacity:1; transform:translateY(0); } }
    @media (prefers-reduced-motion: reduce){
      .rung{ animation:none; opacity:1; transform:none; }
    }

    /* 손글씨 메모(삼춘 노트) */
    .samchun-note{
      background:#fffdf5; border:2px dashed var(--honey);
      transform:rotate(-.6deg);
    }

    /* 마크다운 출력 다듬기 */
    .md h1,.md h2,.md h3{ color:var(--ink); font-weight:800; margin:.9rem 0 .4rem; }
    .md h2{ font-size:1.15rem; } .md h3{ font-size:1.05rem; }
    .md p{ margin:.4rem 0; line-height:1.7; }
    .md ul{ list-style:disc; padding-left:1.3rem; margin:.4rem 0; }
    .md li{ margin:.2rem 0; line-height:1.6; }
    .md strong{ color:var(--blue); }
    .md blockquote{ border-left:4px solid var(--honey); padding-left:.8rem; color:#5b6b86; margin:.6rem 0; }
  </style>
</head>

<body class="min-h-screen">
  <div class="max-w-3xl mx-auto px-4 py-8">

    <!-- ================= 헤더 ================= -->
    <header class="text-center mb-6">
      <img class="mascot" alt="삼춘이" style="width:196px;height:auto;margin:0 auto 8px;display:block;filter:drop-shadow(0 8px 12px rgba(21,54,107,.18))" />
      <h1 class="text-4xl sm:text-5xl tracking-tight" style="font-family:'Jua',sans-serif">
        삼춘네 <span style="color:var(--blue)">질문 도우미</span>
      </h1>
    </header>

    <!-- ================= 탭 ================= -->
    <div class="flex gap-2 mb-4">
      <button data-tab="make" class="tab flex-1 py-2.5 rounded-xl font-bold text-sm transition bg-blue-600 text-white shadow">✏️ 질문 만들기</button>
      <button data-tab="fix"  class="tab flex-1 py-2.5 rounded-xl font-bold text-sm transition bg-white text-slate-500 border border-slate-200">🔍 질문 다듬기</button>
      <button data-tab="plan" class="tab flex-1 py-2.5 rounded-xl font-bold text-sm transition bg-white text-slate-500 border border-slate-200">🧑‍🏫 수업 설계</button>
    </div>

    <!-- ============ 탭1: 질문 만들기 (렌즈 + 사다리) ============ -->
    <section id="panel-make" class="bg-white rounded-2xl shadow-sm border border-blue-100 p-5">
      <label class="block text-sm font-bold mb-1.5">1. 어떤 주제로 질문할까요?</label>
      <input id="topic" type="text" placeholder="예) 옛날과 오늘날의 도구, 물의 순환, 우리 동네 …"
        class="w-full rounded-xl border border-slate-200 px-4 py-3 mb-4 focus:ring-2 focus:ring-blue-300 outline-none" />

      <label class="block text-sm font-bold mb-1.5">2. 어떤 <span style="color:var(--honey)">개념 렌즈</span>로 볼까요? <span class="font-normal text-slate-400">(하나 골라요)</span></label>
      <div id="lensGrid" class="grid grid-cols-2 sm:grid-cols-3 gap-2.5 mb-5"><!-- JS로 채움 --></div>

      <button id="makeBtn"
        class="w-full flex items-center justify-center gap-2 bg-blue-600 hover:bg-blue-700 disabled:opacity-60
               text-white font-bold py-3 rounded-xl transition">
        <span class="btn-label">질문 만들기</span>
      </button>
      <p id="makeStatus" class="text-center text-sm text-slate-400 mt-2 h-5"></p>

      <!-- 질문 사다리 결과 -->
      <div id="ladderWrap" class="hidden mt-5"></div>
    </section>

    <!-- ============ 탭2: 질문 다듬기 (평가) ============ -->
    <section id="panel-fix" class="hidden bg-white rounded-2xl shadow-sm border border-blue-100 p-5">
      <label class="block text-sm font-bold mb-1.5">내가 만든 질문을 적어 주세요</label>
      <textarea id="question" rows="4" placeholder="예) 조선시대 왕은 누구였나요?"
        class="w-full rounded-xl border border-slate-200 px-4 py-3 mb-4 focus:ring-2 focus:ring-blue-300 outline-none resize-y"></textarea>

      <button id="fixBtn"
        class="w-full flex items-center justify-center gap-2 bg-blue-600 hover:bg-blue-700 disabled:opacity-60
               text-white font-bold py-3 rounded-xl transition">
        <span class="btn-label">어떤 질문인지 알아보기</span>
      </button>
      <p id="fixStatus" class="text-center text-sm text-slate-400 mt-2 h-5"></p>

      <div id="fixResult" class="hidden mt-5 md bg-sky-50 border border-blue-100 rounded-xl p-5"></div>
    </section>

    <!-- ============ 탭3: 수업 설계 (교사용) ============ -->
    <section id="panel-plan" class="hidden bg-white rounded-2xl shadow-sm border border-blue-100 p-5">
      <div class="flex items-center gap-2 mb-3">
        <span class="text-xs font-bold px-2 py-0.5 rounded-full text-white bg-blue-600">교사용</span>
        <span class="text-sm text-slate-500">성취기준을 고르면 수업용 질문 세트를 만들어 드려요</span>
      </div>

      <div class="grid sm:grid-cols-2 gap-3 mb-3">
        <div>
          <label class="block text-sm font-bold mb-1">학년군</label>
          <select id="planBand" class="w-full rounded-lg border border-slate-200 px-3 py-2 outline-none focus:ring-2 focus:ring-blue-300"></select>
        </div>
        <div>
          <label class="block text-sm font-bold mb-1">교과</label>
          <select id="planSubject" class="w-full rounded-lg border border-slate-200 px-3 py-2 outline-none focus:ring-2 focus:ring-blue-300"></select>
        </div>
        <div>
          <label class="block text-sm font-bold mb-1">영역</label>
          <select id="planDomain" class="w-full rounded-lg border border-slate-200 px-3 py-2 outline-none focus:ring-2 focus:ring-blue-300"></select>
        </div>
        <div>
          <label class="block text-sm font-bold mb-1">성취기준</label>
          <select id="planStandard" class="w-full rounded-lg border border-slate-200 px-3 py-2 outline-none focus:ring-2 focus:ring-blue-300"></select>
        </div>
      </div>

      <div id="planStdBox" class="hidden text-sm bg-sky-50 border border-blue-100 rounded-lg p-3 mb-3 leading-relaxed"></div>

      <label class="block text-sm font-bold mb-1.5">수업 주제 <span class="font-normal text-slate-400">(선택 — 성취기준을 이 주제로 구체화해요)</span></label>
      <input id="planTopic" type="text" placeholder="예) 하루 일과 소개하기, 우리 학교 행사, 제주 감귤 농사 …"
        class="w-full rounded-lg border border-slate-200 px-3 py-2 mb-4 outline-none focus:ring-2 focus:ring-blue-300" />

      <label class="block text-sm font-bold mb-1.5">개념 렌즈 <span class="font-normal text-slate-400">(선택)</span></label>
      <div id="planLensGrid" class="grid grid-cols-2 sm:grid-cols-3 gap-2.5 mb-4"></div>

      <button id="planBtn"
        class="w-full flex items-center justify-center gap-2 bg-blue-600 hover:bg-blue-700 disabled:opacity-60
               text-white font-bold py-3 rounded-xl transition">
        <span class="btn-label">수업 설계 만들기</span>
      </button>
      <p id="planStatus" class="text-center text-sm text-slate-400 mt-2 h-5"></p>

      <div id="planResultWrap" class="hidden mt-5">
        <div class="flex justify-end gap-2 mb-2">
          <button id="planCopy" class="text-sm px-3 py-1.5 rounded-lg border border-slate-200 hover:bg-slate-50">📋 복사</button>
          <button id="planPrint" class="text-sm px-3 py-1.5 rounded-lg border border-slate-200 hover:bg-slate-50">🖨️ 인쇄</button>
        </div>
        <div id="planResult" class="md bg-sky-50 border border-blue-100 rounded-xl p-5"></div>
      </div>
    </section>


    <footer class="text-center text-xs text-slate-400 mt-8">삼춘네 질문 도우미 · <span class="font-semibold text-slate-500">제주융합과학연구원</span> · 개념기반 탐구수업(CBI)</footer>
  </div>

  // ---------- 개념 렌즈 목록 (초등 눈높이) ----------
  const LENSES = [
    { key:'변화',       emoji:'🔄', hint:'무엇이 어떻게 달라지나요?' },
    { key:'관계',       emoji:'🔗', hint:'서로 어떻게 이어져 있나요?' },

  // 렌즈 카드 그리기
  const lensGrid = document.getElementById('lensGrid');
  LENSES.forEach(l => {
    const btn = document.createElement('button');
    btn.className = 'lens-card text-left rounded-xl border-2 border-slate-200 bg-white px-3 py-2.5 hover:border-blue-300';
    btn.innerHTML = `<div class="text-base font-bold">${l.emoji} ${l.key}</div>
                     <div class="text-xs text-slate-400 mt-0.5">${l.hint}</div>`;
    btn.onclick = () => {
      selectedLens = l.key;
            lensGrid.querySelectorAll('.lens-card').forEach(c => c.classList.remove('selected'));
      btn.classList.add('selected');
    };
    lensGrid.appendChild(btn);
  });

  // ---------- 탭 전환 ----------
  function activate(which){
    const on  = 'tab flex-1 py-2.5 rounded-xl font-bold text-sm transition bg-blue-600 text-white shadow';
    const off = 'tab flex-1 py-2.5 rounded-xl font-bold text-sm transition bg-white text-slate-500 border border-slate-200';
    document.querySelectorAll('.tab').forEach(b => b.className = (b.dataset.tab === which ? on : off));
    ['make','fix','plan'].forEach(p =>
      document.getElementById('panel-' + p).classList.toggle('hidden', p !== which));
  }
  document.querySelectorAll('.tab').forEach(b => b.onclick = () => activate(b.dataset.tab));

  // ---------- 학생 / 교사 모드 ----------
  // 교사용은 주소 뒤에 ?mode=teacher 를 붙여서 엽니다.  예) https://....../exec?mode=teacher
  // 학생용은 그냥 .../exec  → 교사(수업 설계) 탭이 아예 안 보여요.
  // 아래 핀을 비워두면 핀 없이 열리고, 값을 넣으면 교사 모드에서 핀을 물어봅니다(가벼운 가림막).
  const TEACHER_PIN = "";   // 예: "1234"  (비워두면 핀 없음)

  const teacherTabBtn = document.querySelector('.tab[data-tab="plan"]');
  teacherTabBtn.classList.add('hidden');   // 기본(학생)에서는 숨김

  function applyMode(mode){
    if(mode !== 'teacher') return;                 // 학생 화면 유지
    if(TEACHER_PIN){
      const entered = window.prompt('교사용 핀 번호를 입력하세요');
      if(entered !== TEACHER_PIN) return;          // 핀 틀리면 학생 화면 유지
    }
    teacherTabBtn.classList.remove('hidden');       // 교사 탭 보이기
    loadStandards();                                // 성취기준 미리 불러오기(교사 모드에서만)
  }

  // 주소의 ?mode= 값 읽기 (Apps Script 방식)
  if(window.google && google.script && google.script.url){
    google.script.url.getLocation(function(loc){
      const mode = (loc && loc.parameter && loc.parameter.mode) || 'student';
      applyMode(mode);
    });
  }

  // ---------- 공통: AI 호출 (Apps Script 서버 함수 호출) ----------
  // fetch 대신 google.script.run 으로 Code.gs의 askAI(prompt)를 부릅니다.
  function callAI(prompt, statusEl){
    if(statusEl) statusEl.textContent = '삼춘이 생각하는 중… 🤔';
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(text => {
          if(text) resolve(text);
          else reject(new Error('빈 응답이 왔어요. 잠시 뒤 다시 시도해 주세요.'));
        })
        .withFailureHandler(err => reject(new Error(err && err.message ? err.message : '서버 오류가 났어요.')))
        .askAI(prompt);
    });
  }

  // 로딩 상태 토글 (버튼 비활성화 + 스피너)
  function setLoading(btn, loading){
    btn.disabled = loading;
    const label = btn.querySelector('.btn-label');
    let sp = btn.querySelector('.spinner');
    if(loading){
      if(!label.dataset.original) label.dataset.original = label.textContent;
      label.textContent = '분석 중…';
      if(!sp){ sp = document.createElement('span'); sp.className='spinner'; btn.prepend(sp); }
    } else {
      label.textContent = label.dataset.original || label.textContent;
      if(sp) sp.remove();
    }
  }

  const makeBtn = document.getElementById('makeBtn');
  const makeStatus = document.getElementById('makeStatus');

  function buildMakePrompt(topic, lens){

  // JSON 파싱 (혹시 모를 코드블록/잡텍스트 정리)
  function parseJSON(text){
    let t = text.trim().replace(/^```(json)?/i,'').replace(/```$/,'').trim();
    const s = t.indexOf('{'), e = t.lastIndexOf('}');
    if(s !== -1 && e !== -1) t = t.slice(s, e+1);
    return JSON.parse(t);
  }

    function buildFixPrompt(question){

대상은 초등학생 수업이야. 아래 질문이 사실적 질문, 개념적 질문, 논쟁적 질문 중 어디에 가까운지 알려 주고, 이 질문에서 생각을 넓혀 갈 수 있도록 도와줘.

[학생의 질문]

  // ================= 탭3: 수업 설계 (교사용) =================
  let STANDARDS = [];
  let planSelectedLens = null;

  // 렌즈 그리드 (설계 탭용) — 다시 누르면 해제
  LENSES.forEach(l => {
    const btn = document.createElement('button');
    btn.className = 'lens-card text-left rounded-xl border-2 border-slate-200 bg-white px-3 py-2.5 hover:border-blue-300';
    btn.innerHTML = `<div class="text-base font-bold">${l.emoji} ${l.key}</div>
                     <div class="text-xs text-slate-400 mt-0.5">${l.hint}</div>`;
    btn.onclick = () => {
      const grid = document.getElementById('planLensGrid');
      if(planSelectedLens === l.key){ planSelectedLens = null; btn.classList.remove('selected'); return; }
      planSelectedLens = l.key;

  const planBand = document.getElementById('planBand');
  const planSubject = document.getElementById('planSubject');
  const planDomain = document.getElementById('planDomain');
  const planStandard = document.getElementById('planStandard');
  const planStdBox = document.getElementById('planStdBox');

  const uniq = arr => [...new Set(arr)];
  function fillSelect(sel, items, placeholder){
    sel.innerHTML = '';
    const p = document.createElement('option'); p.value = ''; p.textContent = placeholder; sel.appendChild(p);
    items.forEach(v => { const o = document.createElement('option'); o.value = v; o.textContent = v; sel.appendChild(o); });
  }

  // 서버(Code.gs)의 getStandards() 로 성취기준 시트를 불러옴
  function loadStandards(){
    fillSelect(planBand, [], '불러오는 중…');
    google.script.run
      .withSuccessHandler(list => {
        STANDARDS = list || [];
        if(!STANDARDS.length){
          fillSelect(planBand, [], '성취기준 시트를 먼저 연결하세요');
          return;
        }
        fillSelect(planBand, uniq(STANDARDS.map(s => s.band)), '학년군 선택');
        fillSelect(planSubject, [], '교과 선택');
        fillSelect(planDomain, [], '영역 선택');
        fillSelect(planStandard, [], '성취기준 선택');
      })
      .withFailureHandler(() => fillSelect(planBand, [], '불러오기 실패'))
      .getStandards();
  }

  planBand.onchange = () => {
    const subs = uniq(STANDARDS.filter(s => s.band === planBand.value).map(s => s.subject));
    fillSelect(planSubject, subs, '교과 선택');
    fillSelect(planDomain, [], '영역 선택');
    fillSelect(planStandard, [], '성취기준 선택');
    planStdBox.classList.add('hidden');
  };
  planSubject.onchange = () => {
    const doms = uniq(STANDARDS
      .filter(s => s.band === planBand.value && s.subject === planSubject.value)
      .map(s => s.domain));
    fillSelect(planDomain, doms, '영역 선택');
    fillSelect(planStandard, [], '성취기준 선택');
    planStdBox.classList.add('hidden');
  };
  planDomain.onchange = () => {
    const stds = STANDARDS.filter(s =>
      s.band === planBand.value && s.subject === planSubject.value && s.domain === planDomain.value);
    planStandard.innerHTML = '';
    const p = document.createElement('option'); p.value = ''; p.textContent = '성취기준 선택'; planStandard.appendChild(p);
    stds.forEach((s, i) => {
      const o = document.createElement('option');
      o.value = String(i);
      o.textContent = (s.code ? s.code + ' ' : '') + (s.text.length > 40 ? s.text.slice(0, 40) + '…' : s.text);
      planStandard.appendChild(o);
    });
    planStandard._list = stds;
    planStdBox.classList.add('hidden');
  };
  planStandard.onchange = () => {
    const s = (planStandard._list || [])[Number(planStandard.value)];
    if(s){ planStdBox.textContent = (s.code ? s.code + ' ' : '') + s.text; planStdBox.classList.remove('hidden'); }
    else planStdBox.classList.add('hidden');
  };

  // 설계 프롬프트
  function buildPlanPrompt(std, band, subject, domain, lens, topic){
    return `너는 개념기반 탐구수업(Concept-Based Inquiry, CBI) 전문가이자 따뜻한 초등학교 선생님이야.
아래 성취기준으로 '질문 중심' 수업을 설계해 줘.
대상: 초등 ${band} ${subject}${domain ? ' / 영역: ' + domain : ''}
성취기준: ${std}
${topic ? '수업 주제: ' + topic + '  → 이 주제의 구체적인 상황·소재로 질문과 활동을 만들되, 반드시 위 성취기준과 연결되게 해.' : ''}
${lens ? '개념 렌즈: ' + lens : ''}
세 가지 질문(사실적·개념적·논쟁적)은 높고 낮은 단계가 아니라 서로 다른 관점이야. '단계', '수준', '더 깊은', '끌어올리기' 같은 위계 표현은 쓰지 마.

## 🎯 핵심 질문

따뜻하고 격려하는 말투를 유지하고, 모든 질문이 성취기준과 분명히 연결되게 써 줘.${topic ? ' 그리고 위 수업 주제("' + topic + '")에 맞는 구체적인 상황과 소재를 적극 활용해 줘.' : ''}`;

  planBtn.onclick = async () => {

      planResultWrap.classList.remove('hidden');
      planStatus.textContent = '완성! 필요하면 복사하거나 인쇄하세요 🎉';
    }catch(err){
      planStatus.textContent = '앗, ' + err.message;
    }finally{
      setLoading(planBtn, false);
    }
  };

  // 복사 (샌드박스에서도 되도록 폴백 포함)
  document.getElementById('planCopy').onclick = () => {
    const t = planResult.innerText;
    const done = () => { planStatus.textContent = '복사됐어요 📋'; };
    (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject())
      .then(done)
      .catch(() => {
        const ta = document.createElement('textarea'); ta.value = t;
        document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); done(); } finally { ta.remove(); }
      });
  };
  // 인쇄 (결과만 새 창으로 열어 인쇄)
  document.getElementById('planPrint').onclick = () => {
    const w = window.open('', '_blank');

      'h2{color:#15366b;border-bottom:2px solid #eaf2ff;padding-bottom:4px}</style>' +
      planResult.innerHTML);
    w.document.close(); w.focus(); w.print();
  };

  // (성취기준은 교사 모드로 열릴 때 applyMode 에서 불러옵니다)
